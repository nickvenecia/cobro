name: Build Saldo

# Every push and pull request builds and tests Saldo on every platform.
#
# Merging is releasing: when a push to main carries a version (__version__ in saldo/__init__.py) that has no
# tag yet, this same run builds the downloads, tags that exact commit vX.Y.Z and publishes the GitHub Release
# with the files and that version's CHANGELOG notes. Nobody tags or releases by hand. (A tag made by a
# workflow's own token starts no other workflow, so tagging and releasing happen here, in one run.)
# Pushing a tag vX.Y.Z still works, but only when it matches the version. Pull requests never release.
#
# Actions are pinned to exact commits (a tag can be moved; a commit can't). Update them deliberately.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false  # the build never needs to push
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install "ruff==0.16.8"
      - name: Format check
        run: ruff format --check .
      - name: Lint (style, bugs, security)
        run: ruff check .
      - name: The version, its notes, and whether this run releases
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          v=$(python -c "import ast, pathlib; t = ast.parse(pathlib.Path('saldo/__init__.py').read_text()); print(next(n.value.value for n in t.body if isinstance(n, ast.Assign) and n.targets[0].id == '__version__'))")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Saldo $v"
          # every version has its notes at the top of CHANGELOG.md, and nothing waits under "Unreleased"
          python scripts/release_notes.py "$v" > /dev/null
          release=false
          case "$EVENT:$REF" in
            push:refs/tags/*)
              # a release whose app reports another number would keep offering itself as an update
              if [ "$REF_NAME" != "v$v" ]; then
                echo "::error::Tag $REF_NAME doesn't match __version__ $v in saldo/__init__.py. Bump the version and merge it; the release makes its own tag."
                exit 1
              fi
              release=true
              ;;
            push:refs/heads/main | workflow_dispatch:refs/heads/main)
              if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$v" --silent 2>/dev/null; then
                echo "v$v is already tagged: nothing new to release (bump the version to release)."
              else
                echo "v$v has no tag yet: this run builds it, tags this commit and publishes the release."
                release=true
              fi
              ;;
          esac
          echo "release=$release" >> "$GITHUB_OUTPUT"

  build:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: mac-apple-silicon
          - os: macos-15-intel
            name: mac-intel
          - os: windows-latest
            name: windows
          - os: ubuntu-22.04
            name: linux
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false  # the build never needs to push

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Linux libraries for Qt
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libgl1 libcups2

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set +e
          python -m pytest -v -p no:cacheprovider > pytest.log 2>&1
          code=$?
          tail -n 200 pytest.log
          # Qt can crash while Python shuts down AFTER every test has passed (Windows does this);
          # what counts is pytest's own verdict on its last summary line.
          if [ $code -ne 0 ] && python -c "import re,sys; lines=[l for l in open('pytest.log',encoding='utf-8',errors='replace').read().splitlines() if l.startswith('=')]; sys.exit(0 if lines and re.search(r' passed', lines[-1]) and not re.search(r'failed|error', lines[-1]) else 1)"; then
            echo "All tests passed (exit code $code came from shutting down afterwards)."
            code=0
          fi
          if [ $code -ne 0 ]; then
            # Show the end of the test output on the run's summary page (readable without the full log).
            python -c "import sys; lines = open('pytest.log', encoding='utf-8', errors='replace').read().splitlines()[-60:]; print('::error title=Tests failed (exit $code)::' + '%0A'.join(l.replace('%', '%25').replace(chr(13), '') for l in lines))"
          fi
          exit $code

      - name: Build app
        run: pyinstaller saldo.spec --noconfirm

      # the signing certificate is only handed to the signing step (never to installs, tests or the build)
      - name: Is signing set up?
        id: signing
        if: runner.os == 'macOS'
        env:
          HAS_CERT: ${{ secrets.MACOS_CERTIFICATE != '' }}
        run: echo "ready=$HAS_CERT" >> "$GITHUB_OUTPUT"

      # ---------- smoke tests: launch the packaged app, make an invoice, save it as a PDF
      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          dist/Saldo.app/Contents/MacOS/Saldo --smoke-test
          dist/Saldo.app/Contents/MacOS/Saldo cli sample smoke.pdf --header band
          test -s smoke.pdf

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          dist/Saldo/Saldo --smoke-test
          dist/Saldo/Saldo cli sample smoke.pdf --color oxblood
          test -s smoke.pdf

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $p = Start-Process -FilePath dist\Saldo\Saldo.exe -ArgumentList "--smoke-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "GUI smoke test failed: $($p.ExitCode)" }
          $p = Start-Process -FilePath dist\Saldo\Saldo.exe -ArgumentList "cli","sample","smoke.pdf" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "CLI smoke test failed: $($p.ExitCode)" }
          if (-not (Test-Path smoke.pdf)) { throw "no PDF" }

      # ---------- optional: sign + notarize on macOS (only if you add the secrets — see README)
      - name: Sign and notarize (macOS)
        if: runner.os == 'macOS' && steps.signing.outputs.ready == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          CERT="$RUNNER_TEMP/cert.p12"
          trap 'rm -f "$CERT"' EXIT  # gone even if a step below fails
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$CERT"
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import "$CERT" -k build.keychain -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          rm -f "$CERT"
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          find dist/Saldo.app -type f \( -perm -u+x -o -name "*.dylib" -o -name "*.so" \) -print0 | \
            xargs -0 codesign --force --timestamp --options runtime --entitlements packaging/macos/entitlements.plist --sign "$MACOS_SIGN_IDENTITY" || true
          codesign --force --deep --timestamp --options runtime --entitlements packaging/macos/entitlements.plist --sign "$MACOS_SIGN_IDENTITY" dist/Saldo.app
          ditto -c -k --keepParent dist/Saldo.app notarize.zip
          xcrun notarytool submit notarize.zip --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple dist/Saldo.app

      # ---------- package
      # Each download is also made under the app's old name (Cobro-…), shaped the way Cobro's updater expects,
      # so people still on Cobro can update themselves to Saldo (see saldo/core/from_cobro.py)
      - name: Package (macOS .dmg)
        if: runner.os == 'macOS'
        run: |
          mkdir -p out dmg old/dmg
          cp -R dist/Saldo.app dmg/
          ln -s /Applications dmg/Applications
          # Cobro's updater copies Cobro.app out of the disk image: the same app, named so (on its first start it
          # renames itself Saldo.app)
          ditto dist/Saldo.app old/dmg/Cobro.app
          ln -s /Applications old/dmg/Applications
          make_dmg() {
            # hdiutil on GitHub's Macs is sometimes "Resource busy" for a moment: wait and try again
            for try in 1 2 3 4 5; do
              if hdiutil create -volname "Saldo" -srcfolder "$1" -ov -format UDZO "$2"; then
                return 0
              fi
              if [ "$try" = 5 ]; then
                echo "::error::hdiutil couldn't make $2 after 5 tries"
                return 1
              fi
              echo "hdiutil was busy (try $try of 5); trying again"
              sleep $((try * 5))
            done
          }
          make_dmg dmg "out/Saldo-${{ matrix.name }}.dmg"
          make_dmg old/dmg "out/Cobro-${{ matrix.name }}.dmg"

      - name: Package (Windows .zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out, old | Out-Null
          Compress-Archive -Path dist\Saldo -DestinationPath out\Saldo-windows-portable.zip
          # Cobro's updater unpacks a Cobro folder and opens Cobro.exe in it: a copy of Saldo.exe answers to that
          # name until Saldo's next update
          Copy-Item -Recurse dist\Saldo old\Cobro
          Copy-Item old\Cobro\Saldo.exe old\Cobro\Cobro.exe
          $p = Start-Process -FilePath old\Cobro\Cobro.exe -ArgumentList "--smoke-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Cobro.exe smoke test failed: $($p.ExitCode)" }
          Compress-Archive -Path old\Cobro -DestinationPath out\Cobro-windows-portable.zip

      - name: Package (Windows installer)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          $v = (python -c "import saldo; print(saldo.__version__)")
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=$v packaging\windows\saldo.iss
          Copy-Item packaging\windows\Output\Saldo-Setup.exe out\Saldo-windows-setup.exe
          # the same installer for Cobro's updater (it sees a copy installed as Cobro: saldo.iss)
          Copy-Item packaging\windows\Output\Saldo-Setup.exe out\Cobro-windows-setup.exe

      - name: Package (Linux .tar.gz)
        if: runner.os == 'Linux'
        run: |
          mkdir -p out
          cp packaging/linux/install.sh packaging/linux/saldo.desktop saldo/assets/icon.png dist/Saldo/
          chmod +x dist/Saldo/install.sh
          tar -C dist -czf out/Saldo-linux-x64.tar.gz Saldo
          # Cobro's updater unpacks a Cobro folder and opens Cobro in it: a copy of Saldo answers to that name
          mkdir -p old
          cp -a dist/Saldo old/Cobro
          cp old/Cobro/Saldo old/Cobro/Cobro
          QT_QPA_PLATFORM=offscreen old/Cobro/Cobro --smoke-test
          tar -C old -czf out/Cobro-linux-x64.tar.gz Cobro

      - name: Package (Linux AppImage, one file)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          bash packaging/linux/build_appimage.sh dist/Saldo out/Saldo-linux-x64.AppImage
          out/Saldo-linux-x64.AppImage --smoke-test
          cp out/Saldo-linux-x64.AppImage out/Cobro-linux-x64.AppImage  # the same file, for Cobro's updater

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Saldo-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  release:
    # only a push to main (or a matching tag) whose version has no release yet; never a pull request
    needs: [lint, build]
    if: needs.lint.outputs.release == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # one release at a time: two quick merges can't both publish the same version
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.lint.outputs.version }}
      TAG: v${{ needs.lint.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Tag this commit (once per version)
        id: claim
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::notice::$TAG is already released; nothing to do."
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then  # a tag pushed by hand (already checked against the version)
            echo "go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Making a tag that already exists fails, so of two runs only one can make it.
          if gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" --silent; then
            echo "Tagged $GITHUB_SHA as $TAG."
            echo "go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          at=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha 2> /dev/null || true)
          if [ "$at" = "$GITHUB_SHA" ]; then  # this run made it before, then stopped short of publishing
            echo "$TAG is already on this commit: publishing it now."
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$TAG was just made by another run (on ${at:-another commit}); this run doesn't release it again."
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Release notes (this version's CHANGELOG, then the downloads)
        if: steps.claim.outputs.go == 'true'
        run: python3 scripts/release_notes.py "$VERSION" > "$RUNNER_TEMP/notes.md"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.claim.outputs.go == 'true'
        with:
          path: artifacts
          merge-multiple: true

      - name: All six downloads are here (and their copies for Cobro's updater)
        # the README's links and the in-app updater ask for these exact names
        if: steps.claim.outputs.go == 'true'
        run: |
          missing=0
          for f in {Saldo,Cobro}-mac-apple-silicon.dmg {Saldo,Cobro}-mac-intel.dmg {Saldo,Cobro}-windows-setup.exe \
                   {Saldo,Cobro}-windows-portable.zip {Saldo,Cobro}-linux-x64.AppImage {Saldo,Cobro}-linux-x64.tar.gz; do
            if [ ! -s "artifacts/$f" ]; then
              echo "::error::$f wasn't built, so $TAG isn't published. Re-run all jobs; if it needs a code fix, merge it with the next version."
              missing=1
            fi
          done
          exit $missing

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        if: steps.claim.outputs.go == 'true'
        with:
          tag_name: ${{ env.TAG }}
          name: Saldo ${{ env.VERSION }}
          body_path: ${{ runner.temp }}/notes.md
          files: artifacts/*
          fail_on_unmatched_files: true
          make_latest: "true"
